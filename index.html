<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Person Picker</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #6d5efc;
        --accent-dark: #4f46e5;
        --shadow: rgba(15, 23, 42, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        color: var(--text);
      }

      .card {
        width: min(92vw, 420px);
        background: var(--card);
        border-radius: 20px;
        box-shadow: 0 18px 45px var(--shadow);
        padding: 32px 28px;
        text-align: center;
      }

      .label {
        margin: 0 0 18px;
        font-size: 0.85rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .winner {
        min-height: 90px;
        display: grid;
        place-items: center;
        margin: 18px 0 28px;
        font-size: clamp(2rem, 6vw, 3.2rem);
        font-weight: 700;
        color: var(--accent-dark);
      }

      button {
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        padding: 14px 22px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease;
      }

      button:hover {
        background: var(--accent-dark);
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="label">Random Pick</p>
      <div id="winner" class="winner">Jada</div>
      <button id="pickButton" type="button">Try again</button>
    </div>

    <script>
      const people = [
        'Jada',
        'Ananthu',
        'Chris',
        'Shu',
        'Kailen',
        'Claire',
        'Kayanne'
      ];

      const winnerEl = document.getElementById('winner');
      const pickButton = document.getElementById('pickButton');

      function pickRandomPerson() {
        const randomIndex = Math.floor(Math.random() * people.length);
        winnerEl.textContent = people[randomIndex];
      }

      pickButton.addEventListener('click', pickRandomPerson);

      pickRandomPerson();
    </script>
  </body>
</html>
