<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Person Picker</title>
    <style>
      :root {
        --bg: #fdf2f8;
        --card: #fffafc;
        --text: #4b5563;
        --muted: #8b7c99;
        --accent: #f9a8d4;
        --accent-dark: #ec4899;
        --shadow: rgba(168, 85, 247, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #fdf2f8, #f5f3ff, #ecfeff);
        color: var(--text);
      }

      .card {
        width: min(92vw, 420px);
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(252, 165, 165, 0.3);
        border-radius: 24px;
        box-shadow: 0 18px 45px var(--shadow);
        padding: 32px 28px;
        text-align: center;
        backdrop-filter: blur(4px);
      }

      .label {
        margin: 0 0 18px;
        font-size: 0.85rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .winner {
        min-height: 90px;
        display: grid;
        place-items: center;
        margin: 18px 0 28px;
        font-size: clamp(2rem, 6vw, 3.2rem);
        font-weight: 700;
        color: var(--accent-dark);
      }

      button {
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, #f9a8d4, #c4b5fd);
        color: #4c1d95;
        padding: 14px 22px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(244, 114, 182, 0.22);
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      button:hover {
        filter: brightness(1.03);
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="label">Random Pick</p>
      <div id="winner" class="winner">Jada</div>
      <button id="pickButton" type="button">Try again</button>
      <button id="ShuButton" type="button">Shu's Button</button>
    </div>

    <script>
      const people = [
        'Jada',
        'Ananthu',
        'Chris',
        'Shu',
        'Kailen',
        'Claire',
        'Kayanne'
      ];

      const winnerEl = document.getElementById('winner');
      const pickButton = document.getElementById('pickButton');

      function generateRandomHexColor() {
        return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
      }

      function pickRandomPerson() {
        const randomIndex = Math.floor(Math.random() * people.length);
        winnerEl.textContent = people[randomIndex];
        randomColorBg();
      }

      function randomColorBg() {
        const randomColor = generateRandomHexColor();
        document.body.style.background = randomColor;
      }

      pickButton.addEventListener('click', pickRandomPerson);
      const shuButton = document.getElementById('ShuButton');
      shuButton.addEventListener('click', pickRandomPerson);

      pickRandomPerson();
    </script>
  </body>
</html>
